name: Test container

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - compose.test.yaml
      - .github/workflows/test-container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Docker Compose version
        run: docker compose version
      - name: Build image and test reported versions
        run: |
          docker compose -f compose.test.yaml run --build --rm version-check | tee versions.md
          cat versions.md >> "$GITHUB_STEP_SUMMARY"
