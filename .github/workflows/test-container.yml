name: Test container

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - compose.test.yaml
      - .github/workflows/test-container.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Docker Compose version
        run: docker compose version
      - name: Build image
        run: docker compose -f compose.test.yaml build version-check
      - name: Run version check
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.test.yaml run --rm version-check 2>&1 | tee run.log
          sed -n '/^| Component | Version |$/,$p' run.log > versions.md
          grep -Fq "| Alpine Linux |" versions.md
          grep -Fq "| Pandoc via pypandoc |" versions.md
          cat versions.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update version table in Readme.md
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("Readme.md")
          first_line = readme.read_text(encoding="utf-8").splitlines()[0]
          table = Path("versions.md").read_text(encoding="utf-8").strip()
          readme.write_text(f"{first_line}\n\n{table}\n", encoding="utf-8")
          PY
      - name: Commit README version table when changed
        run: |
          if ! git diff --quiet -- Readme.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Readme.md
            git commit -m "docs: update container version table"
            git push
          fi
